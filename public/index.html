<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales CRM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%232563eb%27/%3E%3Cpath d=%27M8 22V12m8 10V8m8 14v-6%27 stroke=%27white%27 stroke-width=%273.5%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">

<body>
  <header class="topbar">
    <div class="brand">Sales CRM</div>
    <nav>
      <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#/deals" data-nav="deals">Deals</a>
      <a href="#/contacts" data-nav="contacts">Contacts</a>

</html>
